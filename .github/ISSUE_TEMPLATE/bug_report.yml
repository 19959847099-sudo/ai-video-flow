name: Bug report
description: Report a reproducible application problem without sharing secrets or private media.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For security issues or leaked credentials, follow SECURITY.md instead. Use synthetic project data here."
  - type: input
    id: version
    attributes:
      label: AI Video Flow version
      placeholder: "0.1.0-rc.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and install type
      placeholder: "Windows 11; Installer or Portable"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use a minimal synthetic project and say whether a fixture or real external provider was involved.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and safe logs
      description: Redact keys, personal paths, and project/media content before attaching logs.
    validations:
      required: true
